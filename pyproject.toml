[project]
name = "scanner"
version = "0.1.0"
description = "Web UI for the multi-exchange crypto arbitrage scanner."
authors = [{ name = "evgetos" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "aiohttp>=3.9,<4.0",
    "aiohttp-socks>=0.10,<1.0",
    "pydantic>=2.7,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
